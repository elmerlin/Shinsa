<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>Pump Shinsa - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #1f1f3f 0%, #0a0a1a 55%);
        color: #f3f6ff;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(460px, 100%);
        background: rgba(20, 20, 40, 0.9);
        border: 1px solid #2a2a4a;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #b4bdd3;
        line-height: 1.55;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      img {
        width: 34px;
        height: 34px;
        border-radius: 8px;
      }

      button {
        margin-top: 16px;
        border: 1px solid #ff4d7a;
        background: rgba(255, 77, 122, 0.16);
        color: #ffd9e3;
        border-radius: 10px;
        padding: 9px 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: rgba(255, 77, 122, 0.25);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="row">
        <img src="/icons/app-icon-192.png" alt="" />
        <h1>You're offline</h1>
      </div>
      <p>
        Pump Shinsa can still open some recently visited pages, but this screen appears when the
        requested content is not cached yet.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
