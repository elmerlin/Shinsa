<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="yg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="yi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer octagonal pad shape -->
  <polygon points="32,2 50,8 58,20 58,44 50,56 32,62 14,56 6,44 6,20 14,8" fill="url(#yg)" stroke="#b45309" stroke-width="2"/>
  <!-- Inner highlight -->
  <polygon points="32,10 44,14 50,24 50,40 44,50 32,54 20,50 14,40 14,24 20,14" fill="url(#yi)" stroke="#d97706" stroke-width="1" opacity="0.7"/>
  <!-- Center circle -->
  <circle cx="32" cy="32" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Inner dot -->
  <circle cx="32" cy="32" r="4" fill="#fef08a" opacity="0.9"/>
</svg>
